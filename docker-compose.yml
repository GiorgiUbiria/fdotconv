version: '3.8'

services:
  fdotconv:
    build: .
    ports:
      - '3002:3000'
    environment:
      - NODE_ENV=production
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
    volumes:
      - /tmp/conversions:/tmp/conversions
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

